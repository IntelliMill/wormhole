[package]
name = "wormhole"
version = "0.1.0"
edition = "2024"
description = "A TUI SSH connection manager with encrypted password vault"
authors = ["Wormhole Contributors"]
license = "MIT"
repository = "https://github.com/wormhole-ssh/wormhole"
readme = "README.md"
keywords = ["ssh", "tui", "terminal", "connection-manager", "vault"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
unicode-width = "0.2"
hex = "0.4"
